name: codex-reanalysis-mapping
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.13
  - minimap2=2.31
  - samtools=1.23.1
  - pigz=2.8
  - pyyaml=6.0.2
  # Provenance records the commit SHA of every run; pinning git here means a
  # host without it still produces a complete record instead of "unknown".
  - git
