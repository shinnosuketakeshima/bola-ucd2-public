# Copy to a local, ignored YAML file. Supply the protected data location with
# `--deliver-root`; do not record local absolute paths in repository config.
tools:
  python: python
  snakemake: snakemake
  samtools: samtools
  samtools_version: 1.23.1
  bcftools: bcftools
  minimap2: minimap2
  minimap2_version: 2.31-r1302
  sniffles: sniffles
  sniffles_version: 2.8.0
  flye: flye
  flye_version: 2.9.6-b1802
reference:
  assembly: ARS-UCD2.0
  accession: GCF_002263795.3
  annotation_release: GCF_002263795.3-RS_2024_12
  annotation_pipeline_version: "10.3"
  base_url: https://ftp.ncbi.nlm.nih.gov/genomes/all/annotation_releases/9913/GCF_002263795.3-RS_2024_12
  checksum_file: md5checksums.txt
  fasta_file: GCF_002263795.3_ARS-UCD2.0_genomic.fna.gz
  gff_file: GCF_002263795.3_ARS-UCD2.0_genomic.gff.gz
  assembly_report_file: GCF_002263795.3_ARS-UCD2.0_assembly_report.txt
  annotation_report_file: GCF_002263795.3-RS_2024_12_annotation_report.xml
  fasta_relative_path: results/codex_reanalysis_v1/01_reference/GCF_002263795.3_ARS-UCD2.0_genomic.fna
  target_spec_relative_path: configs/codex_reanalysis.targets.tsv
  comparison_contigs:
    - "22"
    - "23"
samples:
  sheet_relative_path: configs/codex_reanalysis.samplesheet.schema.tsv
  sample_id_column: sample_id
  fastq_relative_path_column: fastq_relative_path
outputs:
  root: results/codex_reanalysis_v1
  evidence_audit: 07_evidence_audit
  manuscript: 08_manuscript
mapping:
  threads: 8
  preset: map-ont
  retain_secondary: true
  retain_supplementary: true
  # minimap2 keeps at most 5 secondary alignments by default. BoLA class I has
  # nine reference paralogues, so the default truncates the multi-hit evidence
  # that read-level paralogue analysis depends on.
  secondary_max: 20
thresholds:
  minimum_mapping_quality: 20
  minimum_base_quality: 20
  minimum_depth: 10
  maximum_tracked_file_mb: 20
